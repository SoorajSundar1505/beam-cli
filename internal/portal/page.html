<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEAM Portal</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: auto; min-height: 100dvh;
    overflow-x: hidden; overflow-y: auto;
    color: #e8eefc; background: #07080d;
    font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
  }
  .layout {
    /* 260px cannot fit 8 readable columns (see note in tray CSS). */
    display: grid; grid-template-columns: 480px minmax(0, 1fr);
    align-items: stretch; width: 100%; max-width: 100%; height: 100dvh; overflow: hidden;
  }
  aside {
    position: sticky; top: 0; height: 100dvh; max-height: 100dvh; width: 100%;
    min-width: 0; display: flex; flex-direction: column;
    padding: 22px 10px; border-right: 1px solid rgba(160,190,255,.12);
    background: #0b0e16; overflow: hidden;
  }
  aside h1 { flex: none; font-size: 13px; letter-spacing: .14em; color: #9eb0d4; margin: 0 0 12px; }
  /* 8×7 grid. Row height fills the tray so 7 rows stay visible; extras scroll. */
  #tray {
    flex: 1 1 auto; min-height: 0; min-width: 0;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-auto-rows: calc((100% - 48px) / 7);
    gap: 8px; align-content: start;
    overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  }
  .file {
    box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; height: 100%; min-height: 0;
    text-align: left; margin: 0; padding: 8px 6px;
    border-radius: 14px; border: 1px solid rgba(180,200,255,.2); background: #121722; color: inherit;
    overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .file-name {
    display: block; min-width: 0; font-size: 12px; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file small {
    display: block; min-width: 0; color: #93a0bb; font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file.hover {
    border-color: #ffd7a8;
    box-shadow: 0 0 22px rgba(255,160,50,.8), inset 0 0 0 1px rgba(255,200,120,.35);
    outline: 2px solid rgba(255,177,90,.65);
    outline-offset: 1px;
  }
  .file.held {
    border-color: #ffb15a;
    box-shadow: 0 0 26px rgba(255,140,40,.95), inset 0 0 0 1px rgba(255,200,120,.5);
  }
  .tools { flex: none; min-width: 0; max-width: 100%; margin-top: 14px; color: #93a0bb; font-size: 12px; overflow-wrap: anywhere; }
  .tools input { max-width: 100%; }
  main { min-width: 0; max-width: 100%; height: 100dvh; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .stage {
    position: relative; flex: 1 1 auto; min-width: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px 20px 16px;
  }
  .prompt { display: none; }
  #world { position: relative; width: min(100%, 520px, 58dvh); aspect-ratio: 1; margin: 0 auto; }
  #world[hidden] { display: none; }
  #devices { position: absolute; inset: 0; }
  .ring, .portal, .device { position: absolute; left: 50%; top: 50%; border-radius: 50%; }
  .ring { width: 78%; height: 78%; margin: 0; transform: translate(-50%, -50%); pointer-events: none; }
  .ring::before, .ring::after {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  }
  .ring::before {
    inset: -6%;
    background: conic-gradient(from var(--a), #ff5a00, #ffe0a8, #ff8a1e, #ff3d00, #ffd27a, #ff5a00);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 66%, #000 72%, transparent 78%);
    mask: radial-gradient(circle, transparent 62%, #000 66%, #000 72%, transparent 78%);
    filter: drop-shadow(0 0 10px rgba(255,140,30,.85)) drop-shadow(0 0 22px rgba(255,80,0,.45));
    animation: spin 14s linear infinite;
  }
  .ring::after {
    inset: -2%;
    background:
      radial-gradient(circle at 12% 20%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 78% 16%, #ffd7a0 0 1.2px, transparent 2px),
      radial-gradient(circle at 88% 62%, #fff 0 1px, transparent 1.8px),
      radial-gradient(circle at 24% 78%, #ffb15a 0 1.4px, transparent 2px),
      radial-gradient(circle at 50% 8%, #ffe7c2 0 1px, transparent 1.6px),
      radial-gradient(circle at 64% 88%, #ff8a1e 0 1.3px, transparent 2px);
    -webkit-mask: radial-gradient(circle, transparent 58%, #000 64%, #000 84%, transparent 92%);
    mask: radial-gradient(circle, transparent 58%, #000 64%, #000 84%, transparent 92%);
    opacity: .85;
    animation: spin 22s linear infinite reverse;
  }
  #world.opening .ring { animation: bloom .7s ease-out; }
  .portal {
    width: 34%; height: 34%; margin: 0; transform: translate(-50%, -50%);
    display: grid; place-items: center; text-align: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,186,90,.28), transparent 46%),
      radial-gradient(circle at 50% 58%, #24180f, #07080d 74%);
    box-shadow: inset 0 0 36px rgba(255,150,40,.28), 0 0 24px rgba(255,110,20,.2);
    color: #f0d2a4;
  }
  .portal.hot { box-shadow: 0 0 36px rgba(255,150,40,.75), inset 0 0 36px rgba(255,150,40,.28); }
  .portal.sent { box-shadow: inset 0 0 28px rgba(140,220,160,.35), 0 0 24px rgba(140,220,160,.25); color: #b6f3c8; }
  .portal.sent::before { content: "✓"; font-size: 32px; line-height: 1; }
  .device {
    width: clamp(72px, 22%, 92px); height: clamp(72px, 22%, 92px);
    margin: 0; translate: -50% -50%;
    display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 50% 38%, #2c241c, #12100e 72%);
    border: 1px solid rgba(255,186,90,.72); padding: 8px;
    overflow: hidden; overflow-wrap: anywhere; font-size: 12px;
    box-shadow: 0 0 16px rgba(255,120,30,.28);
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .device small { display: block; color: #93a0bb; font-size: 11px; }
  .device.hover, .device:focus-visible { border-color: #ffd7a8; box-shadow: 0 0 16px rgba(255,180,80,.65); }
  .device.selected { border-color: #ffb15a; box-shadow: 0 0 22px rgba(255,140,40,.9); }
  .device.online { border-color: rgba(140,220,160,.7); }
  .device.unreachable { border-color: #ffb4b4; }
  .device.offline { opacity: 0.6; }
  #progress {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%, 0);
    width: min(220px, 46%); max-width: 100%; margin: 0; z-index: 5; text-align: center;
  }
  #progress p { margin: 6px 0 0; font-size: 12px; color: #f0d2a4; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 38dvh) minmax(0, 1fr); }
    aside { position: relative; height: 100%; max-height: none; border-right: 0; border-bottom: 1px solid rgba(160,190,255,.12); }
    main { height: 100%; min-height: 0; }
    .stage { min-height: 0; height: 100%; }
    #world { width: min(78%, 56dvh); }
  }
  #bar { height: 8px; border-radius: 99px; background: #1c2433; overflow: hidden; }
  #bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff6a00, #ffd27a); transition: width .2s linear; }
  .cursor {
    position: fixed; width: 22px; height: 22px; margin: -11px; border-radius: 50%;
    border: 2px solid #ffe7c2;
    background: radial-gradient(circle, #fff 0 3px, transparent 4px);
    box-shadow: 0 0 12px #ff8a1e; pointer-events: none; z-index: 6;
  }
  .heldchip {
    position: fixed; z-index: 6; pointer-events: none; padding: 8px 12px; border-radius: 999px;
    background: rgba(18,23,34,.92); border: 1px solid #ffb15a;
  }
  #status {
    position: absolute; left: 16px; right: 16px; bottom: 18px; z-index: 3;
    margin: 0; text-align: center; pointer-events: none;
    font-size: 13px; letter-spacing: .05em; color: #f0d2a4;
    text-shadow: 0 1px 10px rgba(0,0,0,.8);
  }
  #status.error { color: #ffb4b4; }
  #status.ok { color: #b6f3c8; }
  @media (min-width: 801px) {
    #status { left: 24px; right: 248px; bottom: 28px; }
  }
  #debug {
    position: absolute; left: 16px; bottom: 46px; z-index: 4;
    margin: 0; pointer-events: none; white-space: pre;
    padding: 6px 8px; border-radius: 8px;
    background: rgba(8, 10, 14, .55);
    font: 11px/1.45 ui-monospace, SFMono-Regular, monospace;
    color: rgba(240, 210, 164, .88);
  }
  @media (min-width: 801px) {
    #debug { left: 24px; bottom: 58px; }
  }
  #guide, #arc, #trail { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; background: none; }
  #guide { z-index: 2; }
  #arc { z-index: 3; }
  #trail { z-index: 4; }
  body[data-gesture="SCROLLING"] .cursor { border-color: #8fd0ff; box-shadow: 0 0 16px #8fd0ff; }
  body[data-gesture="PINCHING"] .cursor,
  body[data-gesture="GRABBED"] .cursor,
  body[data-gesture="DRAGGING"] .cursor { width: 12px; height: 12px; margin: -6px; }
  .cam {
    position: absolute; right: 16px; bottom: 16px; z-index: 8; flex: none;
    width: min(32%, 220px); min-width: 140px; max-width: 100%;
    aspect-ratio: 16 / 10; min-height: 88px; height: auto;
    border-radius: 16px; overflow: hidden; background: #141820;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
  }
  .cam video, .cam canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; opacity: 1; filter: none;
  }
  .cam video {
    z-index: 1; object-fit: cover; object-position: center; background: transparent;
    transform: scaleX(-1);
  }
  .cam canvas { z-index: 2; background: none; transform: scaleX(-1); overflow: hidden; }
  @media (max-width: 800px) {
    .cam { position: relative; right: auto; bottom: auto; width: min(100%, 240px); min-width: 0; margin: 0 auto; }
  }
  .cam p {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; margin: 0;
    padding: 14px 8px 6px; text-align: center; font-size: 11px; color: #f0d2a4;
    background: linear-gradient(transparent, rgba(0,0,0,.55));
  }
  @keyframes spin { to { --a: 360deg; } }
  @keyframes bloom { from { transform: translate(-50%, -50%) scale(.15); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>FILE TRAY</h1>
    <div id="tray"></div>
    <div class="tools">
      <p>Move your index fingertip to draw a circle. You do not need to pinch. Drag on the stage with the mouse to try the same stroke.</p>
      <label>Import files <input id="importer" type="file" multiple></label>
      <label><input id="mouse" type="checkbox"> Draw with mouse</label>
      <label><input id="skel" type="checkbox"> Debug</label>
    </div>
  </aside>
  <main>
    <div class="stage" id="stage">
      <p class="prompt" id="prompt">Draw a circle to open the portal.</p>
      <div id="world" hidden>
        <div class="ring"></div>
        <div class="portal" id="portal"></div>
        <div id="devices"></div>
      </div>
      <div class="cam">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="bones" width="640" height="380"></canvas>
        <p id="cammsg" hidden></p>
      </div>
      <div id="progress" hidden><div id="bar"><span id="fill"></span></div><p id="progressText"></p></div>
      <p id="status">Draw a circle to open the portal.</p>
      <div id="debug" hidden></div>
    </div>
  </main>
</div>
<canvas id="guide"></canvas>
<canvas id="arc"></canvas>
<canvas id="trail"></canvas>
<div class="cursor" id="cursor" hidden></div>
<div class="heldchip" id="chip" hidden></div>
<script>
const links = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
const trayEl = document.getElementById("tray");
const deviceEl = document.getElementById("devices");
const world = document.getElementById("world");
const stage = document.getElementById("stage");
const portal = document.getElementById("portal");
const prompt = document.getElementById("prompt");
const cursor = document.getElementById("cursor");
const chip = document.getElementById("chip");
const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debug");
const progress = document.getElementById("progress");
const fill = document.getElementById("fill");
const progressText = document.getElementById("progressText");
const guide = document.getElementById("guide");
const gg = guide.getContext("2d");
const arcLayer = document.getElementById("arc");
const ag = arcLayer.getContext("2d");
const trail = document.getElementById("trail");
const tg = trail.getContext("2d");
const video = document.getElementById("video");
const bones = document.getElementById("bones");
const g = bones.getContext("2d");
let tray = [], devices = [], sending = false, busy = false, landmarker = null, lastVideo = -1, cameraStream = null;
let lastView = null;
// Display-only ink (one active segment). Recognition still uses raw samples via /api/gesture.
let ink = []; // {x, y, t} normalized stage coords
let inkEMA = null;
const INK_JUMP = 0.08;
const INK_GAP_MS = 80;
const INK_STEP_PX = 56;
let diag = { recognizeMs: null, batchMs: null, batchN: 0 };
// File selection: invisible hit pad + magnet (visible card size unchanged).
const fileHitPad = 22;
const fileMagnet = 36; // px pull toward nearest card center
let stickyFile = -1;

function setStatus(text, kind) { statusEl.textContent = text || ""; statusEl.className = kind || ""; }
function deviceStatusLabel(device) {
  const raw = String((device && device.status) || "offline").toLowerCase();
  if (raw === "online") return "Online";
  if (raw === "unreachable") return "Unreachable";
  return "Offline";
}
function deviceIsOnline(device) {
  return String((device && device.status) || "").toLowerCase() === "online";
}
function selectedDeviceStatus(dest) {
  const device = devices[dest];
  if (!device) return null;
  const label = deviceStatusLabel(device);
  return {
    text: `Selected ${device.name} · ${label}`,
    kind: deviceIsOnline(device) ? "ok" : "error"
  };
}
async function loadTray() {
  const body = await (await fetch("/api/tray")).json();
  tray = body.items || [];
  trayEl.replaceChildren();
  tray.forEach((item, i) => {
    const el = document.createElement("div");
    el.className = "file";
    el.dataset.file = String(i);
    el.title = item.name;
    el.setAttribute("aria-label", item.name);
    const name = document.createElement("span");
    name.className = "file-name";
    name.textContent = item.name;
    const meta = document.createElement("small");
    meta.textContent = item.kind;
    el.append(name, meta);
    trayEl.append(el);
  });
  if (!tray.length) trayEl.textContent = "No files yet. Start with beam portal --tray DIRECTORY, or import files.";
}
async function loadDevices() {
  const body = await (await fetch("/api/devices")).json();
  devices = body.devices || [];
  deviceEl.replaceChildren();
  devices.forEach((device, i) => {
    const el = document.createElement("div");
    el.className = "device " + (device.status || "");
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.dataset.device = String(i);
    const angle = -Math.PI / 2 + i * 2 * Math.PI / Math.max(devices.length, 1);
    el.style.transform = `translate(${Math.cos(angle) * orbitRadius()}px, ${Math.sin(angle) * orbitRadius()}px)`;
    el.innerHTML = `${device.name}<small>${device.status.toUpperCase()}</small>`;
    deviceEl.append(el);
  });
  if (lastView && !world.hidden && lastView.held < 0 && !sending) {
    const sel = selectedDeviceStatus(lastView.destination);
    if (sel) {
      setStatus(sel.text, sel.kind);
      document.querySelectorAll(".device").forEach((el, i) => {
        el.classList.toggle("selected", lastView.destination === i);
      });
    }
  }
}
function orbitRadius() {
  const size = world.clientWidth || Math.min(stage.clientWidth, 560);
  return Math.max(88, size * 0.42);
}
function placeDevices() {
  const radius = orbitRadius();
  const nodes = document.querySelectorAll(".device");
  nodes.forEach((el, i) => {
    const angle = -Math.PI / 2 + i * 2 * Math.PI / Math.max(nodes.length, 1);
    el.style.transform = `translate(${Math.cos(angle) * radius}px, ${Math.sin(angle) * radius}px)`;
  });
}
const trayBand = 0.18;
function clamp01(v) { return Math.min(1, Math.max(0, v)); }
function stageSpace() {
  const aside = document.querySelector("aside").getBoundingClientRect();
  const main = document.querySelector("main").getBoundingClientRect();
  const stacked = aside.width > innerWidth * 0.85;
  const size = Math.max(1, Math.min(main.width, main.height) * 0.92);
  return {
    aside, main, stacked, size,
    left: main.left + (main.width - size) / 2,
    top: main.top + (main.height - size) / 2
  };
}
function stagePointer(nx, ny) {
  const s = stageSpace();
  return { px: s.left + clamp01(nx) * s.size, py: s.top + clamp01(ny) * s.size };
}
function pointerFromNorm(nx, ny) {
  const s = stageSpace();
  nx = clamp01(nx);
  ny = clamp01(ny);
  if (!s.stacked && nx < trayBand) {
    return { px: s.aside.left + (nx / trayBand) * s.aside.width, py: s.aside.top + ny * s.aside.height };
  }
  if (s.stacked && ny < trayBand) {
    return { px: s.aside.left + nx * s.aside.width, py: s.aside.top + (ny / trayBand) * s.aside.height };
  }
  return stagePointer(nx, ny);
}
function normFromPointer(px, py) {
  const s = stageSpace();
  const inAside = px >= s.aside.left && px <= s.aside.right && py >= s.aside.top && py <= s.aside.bottom;
  if (!s.stacked && inAside && px < s.main.left) {
    return {
      x: clamp01(((px - s.aside.left) / Math.max(1, s.aside.width)) * trayBand),
      y: clamp01((py - s.aside.top) / Math.max(1, s.aside.height))
    };
  }
  if (s.stacked && inAside) {
    return {
      x: clamp01((px - s.aside.left) / Math.max(1, s.aside.width)),
      y: clamp01(((py - s.aside.top) / Math.max(1, s.aside.height)) * trayBand)
    };
  }
  return { x: clamp01((px - s.left) / s.size), y: clamp01((py - s.top) / s.size) };
}
function sizeLayer(canvas, ctx) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, innerWidth);
  const h = Math.max(1, innerHeight);
  const bw = Math.floor(w * dpr), bh = Math.floor(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
}
function paintGuide() {
  sizeLayer(guide, gg);
}
function paintArc(view) {
  // Clear only — fitted arc must not overlap the fingertip trail.
  sizeLayer(arcLayer, ag);
  void view;
}
function clearInk() {
  ink = [];
  inkEMA = null;
}
// One continuous fingertip segment for display. Gaps/jumps start a new segment
// (old points discarded) so stale arcs never stack under the live stroke.
function pushInk(nx, ny, now, present) {
  if (!present || !world.hidden) {
    clearInk();
    return;
  }
  if (inkEMA) {
    const jump = Math.hypot(nx - inkEMA.x, ny - inkEMA.y);
    const gap = ink.length ? now - ink[ink.length - 1].t : 0;
    if (jump > INK_JUMP || gap > INK_GAP_MS) clearInk();
  }
  if (!inkEMA) {
    inkEMA = { x: nx, y: ny };
  } else {
    // Light EMA — enough to kill zigzag, low enough to stay on the fingertip.
    const a = 0.5;
    inkEMA.x += a * (nx - inkEMA.x);
    inkEMA.y += a * (ny - inkEMA.y);
  }
  const x = inkEMA.x, y = inkEMA.y;
  if (ink.length) {
    const last = ink[ink.length - 1];
    const a = stagePointer(last.x, last.y), b = stagePointer(x, y);
    const dist = Math.hypot(b.px - a.px, b.py - a.py);
    if (dist > INK_STEP_PX) {
      clearInk();
      inkEMA = { x, y };
    } else if (dist < 1.0) {
      last.x = x;
      last.y = y;
      last.t = now;
      return;
    }
  }
  ink.push({ x, y, t: now });
  if (ink.length > 420) ink.shift();
}
function paintTrail(view) {
  sizeLayer(trail, tg);
  if (view && view.open) {
    clearInk();
    return;
  }
  // Server reset (new attempt / stall) must wipe display ink too.
  if (view && (!view.trail || view.trail.length === 0) && ink.length) clearInk();
  if (ink.length < 2) return;
  tg.save();
  tg.strokeStyle = "rgba(255, 186, 110, .95)";
  tg.lineWidth = 3;
  tg.lineJoin = "round";
  tg.lineCap = "round";
  tg.shadowColor = "rgba(255, 120, 30, .55)";
  tg.shadowBlur = 8;
  tg.beginPath();
  const first = stagePointer(ink[0].x, ink[0].y);
  tg.moveTo(first.px, first.py);
  for (let i = 1; i < ink.length; i++) {
    const p = stagePointer(ink[i].x, ink[i].y);
    tg.lineTo(p.px, p.py);
  }
  tg.stroke();
  tg.shadowBlur = 0;
  tg.restore();
}
function paint(view) {
  lastView = view;
  const open = !!view.open;
  document.body.classList.toggle("portal-open", open);
  world.hidden = !open;
  if (open) placeDevices();
  if (view.recognized) {
    clearInk();
    world.classList.add("opening");
    portal.classList.remove("sent");
    setTimeout(() => world.classList.remove("opening"), 700);
  }
  prompt.hidden = true;
  document.body.dataset.gesture = view.phase || "IDLE";
  cursor.hidden = false;
  if (view.scroll) trayEl.scrollTop += view.scroll;
  let finger = !open ? stagePointer(view.x, view.y) : pointerFromNorm(view.x, view.y);
  // Magnetic snap only when choosing a file — not while carrying one to the portal.
  if (open && view.held < 0 && view.hoverFile >= 0) {
    finger = magnetTowardFile(finger.px, finger.py, view.hoverFile);

function fileCardCenter(index) {

// Nearest card inside an expanded hit box — pads overlap, so center distance wins.
function nearestFile(px, py, pad) {

function traySample(px, py) {

async function completeSend(view) {

    const item = tray[view.held];
    let device = devices[view.destination];
    if (!item || !device) throw new Error("Select a device first");
    // Offline / unreachable: fail immediately (refresh devices with a short cap).
    const t0 = performance.now();
    if (!deviceIsOnline(device)) {
      try {
        await Promise.race([
          loadDevices(),
          new Promise((resolve) => setTimeout(resolve, 120))
        ]);
      } catch (_) {}
      device = devices[view.destination] || device;
    }
    if (!deviceIsOnline(device)) {
      const ms = Math.max(1, Math.round(performance.now() - t0));
      throw new Error(`${device.name} is ${deviceStatusLabel(device)} (${ms}ms)`);
    }
    progress.hidden = false;
    progressText.textContent = `Sending to ${device.name}…`;
    const started = await fetch("/api/send/tray", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({device: device.id, item: item.id})
    });
    const job = await started.json();
    if (!started.ok) throw new Error(job.error || "Transfer failed");
    jobId = job.id;
    const deadline = performance.now() + 120000;
    for (;;) {
      if (performance.now() > deadline) {
        if (jobId) await fetch("/api/jobs/" + jobId + "/cancel", {method: "POST"});
        throw new Error("Transfer timed out");
      }
      const state = await (await fetch("/api/jobs/" + jobId)).json();
      const pct = state.total > 0 ? state.percent : 0;
      fill.style.width = pct + "%";
      progressText.textContent = state.total > 0
        ? `Sending to ${device.name}… ${pct}%`
        : `Sending to ${device.name}…`;
      if (state.status === "done") {
        setStatus("File sent", "ok");
        progressText.textContent = "File sent";
        portal.classList.add("sent");
        break;
      }
      if (state.status === "error") throw new Error(state.error || "Transfer failed");
      if (state.status === "cancelled") { setStatus("Transfer cancelled"); break; }
      await new Promise(r => setTimeout(r, 200));
    }

}
async function step(x, y, pinch, confidence, present) {
  const res = await fetch("/api/gesture", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(gestureFrame(x, y, pinch, confidence, present))

  await applyGestureView(await res.json(), null);
}
function fitPreview() {
  const box = video.getBoundingClientRect();

  const w = Math.max(1, Math.round(box.width * dpr));
  const h = Math.max(1, Math.round(box.height * dpr));

    bones.width = w;
    bones.height = h;
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, box.width || 1, box.height || 1);

}
function clearPreview() {
  fitPreview();
}
function drawPreview(landmarks) {

  g.beginPath();
  g.rect(0, 0, box.width, box.height);
  g.clip();
  g.lineCap = "round";
  g.lineJoin = "round";
  g.strokeStyle = "rgba(255, 220, 180, .55)";
  g.lineWidth = 1;

    g.beginPath();
    g.moveTo(at[a].x, at[a].y);
    g.lineTo(at[b].x, at[b].y);
    g.stroke();
  }
  g.fillStyle = "rgba(255, 236, 214, .75)";
  for (let i = 0; i < at.length; i++) {

    g.beginPath();
    g.arc(at[i].x, at[i].y, 1.4, 0, Math.PI * 2);
    g.fill();

// object-fit: cover crops the frame. The canvas is mirrored with the video,

function coverMap(nx, ny, videoW, videoH, boxW, boxH) {

  const ox = (boxW - videoW * scale) / 2;
  const oy = (boxH - videoH * scale) / 2;
  return { x: ox + nx * videoW * scale, y: oy + ny * videoH * scale };
}

const cammsg = document.getElementById("cammsg");
function cameraMessage(text) {

  cammsg.textContent = text || "";
}
function stopCamera() {
  if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
  cameraStream = null;
  video.srcObject = null;
  if (landmarker && landmarker.close) landmarker.close();
  landmarker = null;
}
function logCamera(reason) {
  const track = cameraStream && cameraStream.getVideoTracks()[0];

    reason,
    readyState: video.readyState,
    videoWidth: video.videoWidth,
    videoHeight: video.videoHeight,

function camera() {

  cameraStart = startCamera();

async function startCamera() {

  }

// Queue webcam samples; flush as ONE batched /api/gesture call so recognition

        gestureFrame(s.x, s.y, s.pinch, s.confidence, s.present)

        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ samples })

      diag.batchN = samples.length;

async function frame() {

      paintTrail(lastView || { open: false });
      enqueueGesture({ x: nx, y: ny, pinch, confidence: score, present: true, t: now });

      pushInk(0, 0, now, false);

const stageMain = document.querySelector("main");
